name: Daily Auto-Update & Build

permissions:
  contents: write

on:
  schedule:
    - cron: '0 4 * * *'  # Runs daily at 04:00 UTC
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      version: ${{ steps.check.outputs.version }}
      source: ${{ steps.check.outputs.source }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python3 -m pip install -q requests beautifulsoup4 packaging

      - name: Check for New YouTube Music Version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build_out config
          MANIFEST_JSON="build_out/patches-list.json"
          
          SOURCE_REPO="anddea/revanced-patches"
          SOURCE_MANIFEST="https://raw.githubusercontent.com/anddea/revanced-patches/refs/heads/main/patches-list.json"
          
          curl -sL -o "$MANIFEST_JSON" "$SOURCE_MANIFEST"
          
          # Detect highest supported YouTube Music version by Anddea patches
          DETECTED_VER=$(python3 tools/patch_orchestrator.py detect_version "$MANIFEST_JSON" "8.30.54")
          echo "🔍 Latest patch-compatible version detected: $DETECTED_VER"

          TAG_NAME="v$DETECTED_VER"

          # Check if release with this tag already exists in this repository
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "✅ Version $TAG_NAME is already built and released! Nothing to do."
            echo "has_update=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 New version discovered: $TAG_NAME! Starting build..."
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "version=$DETECTED_VER" >> $GITHUB_OUTPUT
            echo "source=anddea" >> $GITHUB_OUTPUT
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.has_update == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Utilities & Python Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip unzip curl
          python3 -m pip install -q packaging requests beautifulsoup4

      - name: Run Build Script
        run: |
          chmod +x tools/*.sh customize.sh service.sh action.sh uninstall.sh
          bash tools/build-module.sh \
            "${{ needs.check-version.outputs.version }}" \
            "${{ needs.check-version.outputs.source }}" \
            "${{ needs.check-version.outputs.tag }}" \
            "release" \
            "config/golden-preset.json"

      - name: Publish Official Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODULE_ZIP=$(ls build_out/YouTubeMusic.RVX.v*.zip | head -n 1)
          NONROOT_APK=$(ls build_out/YouTubeMusic.RVX.v*-NonRoot.apk | head -n 1)
          VERSION_TAG=$(basename "$MODULE_ZIP" .zip | sed 's/YouTubeMusic.RVX.//')
          RELEASE_TITLE="YouTube Music RVX $VERSION_TAG"

          sed -e "s/\$VERSION_TAG/$VERSION_TAG/g" \
              -e "s/\$SOURCE/${{ needs.check-version.outputs.source }}/g" \
              -e "s/\$NONROOT_APK/$(basename "$NONROOT_APK")/g" \
              -e "s/\$MODULE_ZIP/$(basename "$MODULE_ZIP")/g" \
              config/release_notes_template.md > build_out/release_notes.md

          echo "🚀 Publishing official release: $VERSION_TAG"
          gh release create "$VERSION_TAG" "$MODULE_ZIP" "$NONROOT_APK" \
            --title "$RELEASE_TITLE" \
            --notes-file build_out/release_notes.md \
            --verify-tag || \
          (echo "⚠️ Release $VERSION_TAG already exists, updating assets & notes..." && \
           gh release upload "$VERSION_TAG" "$MODULE_ZIP" "$NONROOT_APK" --clobber && \
           gh release edit "$VERSION_TAG" --title "$RELEASE_TITLE" --notes-file build_out/release_notes.md)
